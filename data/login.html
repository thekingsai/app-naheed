<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AiHealth</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#f3f5fb"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet"><style>
:root{
 --bg:#f3f6fb;--card:#ffffff;--c2:#eef2f8;--c3:#e3e9f2;--ink:#1f1f1f;--ink2:#444746;--muted:#5f6368;--line:#dde3ea;
 --pri:#0b57d0;--pri-c:#d3e3fd;--on-pri-c:#041e49;--on-pri:#ffffff;
 --good:#146c2e;--good-c:#c4eed0;--warn:#8a5100;--warn-c:#ffe0a8;--bad:#b3261e;--bad-c:#fadcd9;--chk:#6142b8;--chk-c:#e8def8;
 --m-sugar:#1a73e8;--m-kid:#00897b;--m-heart:#d93025;--m-blood:#c2185b;--m-bone:#f29900;--m-thy:#7b1fa2;--m-liver:#8d6e63;--m-vit:#2e7d32;
 --shadow:0 1px 2px rgba(60,64,67,.12),0 1px 3px 1px rgba(60,64,67,.06);
 --f:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#111316;--card:#1d2024;--c2:#252a30;--c3:#30363d;--ink:#e6e8eb;--ink2:#c5c8cc;--muted:#9aa0a6;--line:#30363d;
 --pri:#a8c7fa;--pri-c:#0842a0;--on-pri-c:#d3e3fd;--on-pri:#062e6f;
 --good:#7fdc9a;--good-c:#0f3d1f;--warn:#ffc46b;--warn-c:#4a2f00;--bad:#ffb4ab;--bad-c:#5c1612;--chk:#cfbcff;--chk-c:#382770;
 --m-sugar:#8ab4f8;--m-kid:#4dd0c1;--m-heart:#f28b82;--m-blood:#f48fb1;--m-bone:#fdd663;--m-thy:#ce93d8;--m-liver:#bcaaa4;--m-vit:#81c995;
 --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#111316;--card:#1d2024;--c2:#252a30;--c3:#30363d;--ink:#e6e8eb;--ink2:#c5c8cc;--muted:#9aa0a6;--line:#30363d;
 --pri:#a8c7fa;--pri-c:#0842a0;--on-pri-c:#d3e3fd;--on-pri:#062e6f;
 --good:#7fdc9a;--good-c:#0f3d1f;--warn:#ffc46b;--warn-c:#4a2f00;--bad:#ffb4ab;--bad-c:#5c1612;--chk:#cfbcff;--chk-c:#382770;
 --m-sugar:#8ab4f8;--m-kid:#4dd0c1;--m-heart:#f28b82;--m-blood:#f48fb1;--m-bone:#fdd663;--m-thy:#ce93d8;--m-liver:#bcaaa4;--m-vit:#81c995;
 --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:30px;font-weight:500;letter-spacing:-.01em}
h2{font-size:20px;font-weight:500}
h3{font-size:16px;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico.sm{width:20px;height:20px}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:96px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;background:var(--bg)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;margin-bottom:14px}
.fab{width:56px;height:56px;border-radius:16px;border:0;background:var(--pri-c);color:var(--on-pri-c);display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:18px}
.nav{display:flex;flex-direction:column;gap:10px;align-items:center}
.nv{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink2);padding:0}
.nv .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nv[aria-selected="true"]{color:var(--ink)}
.nv[aria-selected="true"] .pill{background:var(--pri-c);color:var(--on-pri-c)}
.nv:hover .pill{background:var(--c3)}
.nv[aria-selected="true"]:hover .pill{background:var(--pri-c)}
.content{min-width:0;padding:20px 32px 48px}
.page{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 6px}
.topbar .sub{font-size:14px;color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--c3)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:#e8a87c;color:#3b1d06;font-weight:600;font-size:16px;display:grid;place-items:center;flex-shrink:0}
.sample{font-size:13px;color:var(--on-pri-c);background:var(--pri-c);border-radius:999px;padding:6px 14px;justify-self:start}
@media(max-width:760px){
 .shell{grid-template-columns:1fr}
 .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:10px 4px calc(12px + env(safe-area-inset-bottom));background:var(--c2);z-index:15}
 .rail .logo{display:none}
 .nav{flex-direction:row;justify-content:space-around;width:100%;gap:0}
 .nav .nv{flex:1}
 .fab{position:fixed;right:16px;bottom:96px;margin:0;z-index:16;box-shadow:0 3px 6px rgba(0,0,0,.18)}
 .content{padding:12px 16px 120px}
 h1{font-size:26px}
 .tools .icon-btn.hide-sm{display:none}
}

/* cards */
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.lnk{background:none;border:0;color:var(--pri);font-weight:500;font-size:14px;padding:6px 10px;border-radius:999px}
.lnk:hover{background:var(--pri-c)}
.lnk.inline{padding:0}
.lnk.inline:hover{background:none;text-decoration:underline}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{gap:12px}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.good{background:var(--good-c);color:var(--good)}
.chip.warn{background:var(--warn-c);color:var(--warn)}
.chip.bad{background:var(--bad-c);color:var(--bad)}
.chip.chk{background:var(--chk-c);color:var(--chk)}
.chip.none{background:var(--c3);color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:24px 28px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--c3)}
.ring .p1{stroke:var(--good)}
.ring .p2{stroke:var(--pri)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font-size:30px;font-weight:500;line-height:1}
.ring .lab span{font-size:12px;color:var(--muted)}
.hero-txt{display:grid;gap:12px}
.hero-txt .big{font-size:22px;line-height:1.35}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--c2);border-radius:16px;padding:12px 14px;font-size:14.5px}
.coach .spk{color:var(--pri);margin-top:1px}
@media(max-width:760px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 18px}.ring{width:140px;height:140px}.hero-txt .big{font-size:19px}.legend{justify-content:center}.coach{text-align:left}}

/* tiles */
.tile{display:grid;gap:6px;border:0;text-align:left;cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-1px)}
.tile .t-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.tile .v{font-size:32px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;color:var(--muted);font-weight:400;margin-left:3px}
.tile .note{font-size:13px;color:var(--muted)}
svg.mini{width:100%;height:40px;display:block}
@media(max-width:760px){.tile .v{font-size:26px}.card{padding:16px;border-radius:20px}.tile .note{display:block}}

/* lists */
.list{display:grid}
.row{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:14px;background:none;border:0;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
button.row:hover{background:var(--c2)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.good{background:var(--good-c);color:var(--good)}
.ic.warn{background:var(--warn-c);color:var(--warn)}
.ic.bad{background:var(--bad-c);color:var(--bad)}
.ic.chk{background:var(--chk-c);color:var(--chk)}
.ic.pri{background:var(--pri-c);color:var(--on-pri-c)}
.row .tx{flex:1;min-width:0;display:grid;gap:1px}
.row .tx b{font-weight:500}
.row .tx span{font-size:14px;color:var(--muted)}
.row .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .val b{font-size:18px;font-weight:500}
.row .val span{display:block;font-size:12.5px;color:var(--muted)}
.spark{width:72px;height:28px;flex-shrink:0}
@media(max-width:600px){.spark{display:none}.row{gap:12px;padding:12px 4px}.row .chip.hide-xs{display:none}}
.st-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:6px 4px -6px}

/* chips / seg / buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--pri-c);border-color:var(--pri-c);color:var(--on-pri-c)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pri-c);color:var(--on-pri-c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 22px;font-weight:500;font-size:15px;background:var(--pri);color:var(--on-pri)}
.btn.tonal{background:var(--pri-c);color:var(--on-pri-c)}
.btn.outline{background:none;border:1px solid var(--line);color:var(--pri)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .band{fill:var(--good-c);opacity:.7}
.chart .grid{stroke:var(--line)}
.chart .axis{fill:var(--muted);font:12px var(--f)}
.chart .line{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke-width:3;fill:var(--card)}
.chart .lbl{font:600 12.5px var(--f);fill:var(--ink)}
.chart .bandlbl{font:500 11.5px var(--f);fill:var(--good)}

/* detail */
.appbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.appbar .ttl{font-size:18px;font-weight:500}
.d-head{display:grid;gap:8px}
.d-head .v{font-size:48px;font-weight:500;line-height:1}
.d-head .v small{font-size:18px;color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:20px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.card-h{flex-wrap:wrap}}
.ai{display:grid;gap:10px}
.who{display:flex;align-items:center;gap:8px;color:var(--pri);font-weight:500;font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:30}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(460px,calc(100% - 24px));background:var(--card);border-radius:28px;z-index:31;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px 24px}
.sheet .body{padding:8px 24px 24px;overflow:auto;display:grid;gap:14px;align-content:start}
.handle{display:none}
@media(max-width:760px){.sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:85vh;border-radius:28px 28px 0 0}.handle{display:block;width:32px;height:4px;border-radius:2px;background:var(--muted);opacity:.4;margin:10px auto 0}}

/* forms */
label{display:grid;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink2)}
input,select{font:16px var(--f);color:var(--ink);background:var(--card);border:1px solid var(--muted);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
.formrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end}
@media(max-width:760px){.formrow{grid-template-columns:1fr 1fr}.formrow label:first-child{grid-column:1/-1}.formrow .btn{grid-column:1/-1}}
.drop{border:2px dashed var(--line);border-radius:20px;padding:28px 16px;display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted)}
.drop .ic{width:56px;height:56px}
.drop b{color:var(--ink);font-weight:500}

/* chat */
.chat{display:grid;gap:16px;max-width:800px}
.q{justify-self:end;max-width:82%;background:var(--pri-c);color:var(--on-pri-c);padding:12px 16px;border-radius:20px 20px 6px 20px}
.a{display:grid;gap:8px;max-width:94%}
.bub{background:var(--card);border-radius:20px 20px 20px 6px;padding:14px 18px;display:grid;gap:8px;box-shadow:var(--shadow)}
.bub ul{margin:0;padding-left:20px;display:grid;gap:5px}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src span{font-size:12.5px;background:var(--c2);border-radius:8px;padding:3px 9px;color:var(--ink2)}
.askbar{position:sticky;bottom:0;padding:16px 0 8px;background:linear-gradient(transparent,var(--bg) 30%);max-width:800px}
.askbar .in{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.askbar input{border:0;padding:8px 0;background:none;border-radius:0}
.askbar input:focus{outline:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;flex-shrink:0}
@media(max-width:760px){.askbar{bottom:84px}}

/* profile */
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof .avatar{width:72px;height:72px;font-size:28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tl{display:grid}
.tl .it{display:grid;grid-template-columns:20px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl .it::before{content:"";position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl .it:last-child::before{display:none}
.tl .b{width:12px;height:12px;border-radius:50%;background:var(--pri);margin:6px 0 0 4px}
.tl .it b{font-weight:500}
.tl .it span{font-size:13px;color:var(--muted)}

/* mom */
.mom{max-width:640px;display:grid;gap:16px}
.mom h1{font-size:36px}
.mom .big{font-size:21px;color:var(--ink2)}
.mcard{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:22px}
.mcard .ic{width:52px;height:52px;grid-row:span 2}
.mcard .ic .ico{width:28px;height:28px}
.mcard h2{font-size:23px;line-height:1.3}
.mcard p{font-size:18px;color:var(--muted)}

/* sign in */
.signin{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
.signin form{width:min(420px,100%);display:grid;gap:18px;background:var(--card);border-radius:28px;padding:32px 28px;box-shadow:var(--shadow)}
.signin .logo{margin:0 auto 4px;width:56px;height:56px;border-radius:18px}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.code input{text-align:center;padding:12px 0;font-size:20px;font-weight:500}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar{overflow:hidden;padding:0}
.eyebrow{font-size:13px;font-weight:500;color:var(--pri);letter-spacing:.02em}
#pg-title.big{font-size:34px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--muted);margin-top:4px}
.sync{display:inline-flex;align-items:center;gap:6px;background:var(--c2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.priv{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
@media(max-width:760px){#pg-title.big{font-size:28px}}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:12;max-width:1080px;margin:-20px auto 8px;padding:14px 0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.logo-sm{width:34px;height:34px;border-radius:11px;background:var(--pri);color:var(--on-pri);display:grid;place-items:center}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#fff;padding:3px 9px 3px 7px;border-radius:999px;background:linear-gradient(110deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b,#3b82f6);background-size:300% 100%;animation:aiShift 8s linear infinite;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 2px 12px rgba(139,92,246,.4)}
.ai-badge .ico{width:12px;height:12px;stroke:#fff;animation:aiTwinkle 3s ease-in-out infinite}
@keyframes aiShift{to{background-position:-300% 0}}
@keyframes aiTwinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.ai-badge,.ai-badge .ico{animation:none}}
@media(max-width:760px){.apphead{margin:-12px -16px 6px;padding:10px 16px}.brand{font-size:17px}}
.row .tx .ttl{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.row .tx .ttl b{overflow:hidden;text-overflow:ellipsis}
.row .tx .ttl .dt{flex-shrink:0;font-size:12.5px;color:var(--muted)}
.row .tx .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar{position:static!important;padding:0!important;margin-bottom:-8px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--pri-c);color:var(--on-pri-c);border-radius:999px;padding:8px 16px 8px 11px;font-weight:600;font-size:14.5px;cursor:pointer}
.backbtn:hover{filter:brightness(.96)}
.appbar .crumb{font-size:14px;color:var(--muted)}
.ttlrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ttlrow .ai-badge{font-size:12.5px;padding:4px 11px 4px 9px}
